# Render blueprint: the Hivemind server as a Docker web service.
# FalkorDB runs on FalkorDB Cloud (free tier): set HIVEMIND_FALKORDB_URL to its
# connection string, e.g. redis://default:PASSWORD@HOST:PORT
services:
  - type: web
    name: hivemind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HIVEMIND_FALKORDB_URL
        sync: false
      - key: HIVEMIND_API_KEY
        generateValue: true
      - key: HIVEMIND_PUBLIC
        value: "1"
