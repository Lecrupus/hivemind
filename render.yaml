# Render blueprint: one free web service running FalkorDB + Hivemind in one container.
# Deploy: https://render.com/deploy?repo=https://github.com/Lecrupus/hivemind
# Memory is in-process and resets on restart (the demo is re-seeded at start), which suits a demo.
# For durable team memory, set dockerfilePath to ./Dockerfile and add HIVEMIND_FALKORDB_URL
# pointing at FalkorDB Cloud (redis://default:PASSWORD@HOST:PORT).
services:
  - type: web
    name: hivemind
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/standalone/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: HIVEMIND_API_KEY
        generateValue: true
